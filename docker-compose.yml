version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - NEXTAUTH_SECRET=generate_a_strong_secret_for_production
      - NEXTAUTH_URL=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Mount the SQLite database file to persist data across container restarts
      - sqlite_data:/app/prisma
    restart: unless-stopped

volumes:
  sqlite_data:
